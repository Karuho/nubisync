[workspace]
resolver = "3"
members = [
  "crates/nubisync-core",
  "crates/nubisync-drive",
  "crates/nubisync-storage",
  "crates/nubisync-auth",
  "crates/nubisync-sync",
  "crates/nubisync-daemon",
  "crates/nubisync-telemetry",
  "crates/nubisync-cli",
]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["Karuho / DynaDev"]
license-file = "LICENSE"
repository = "https://github.com/Karuho/nubisync"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
keyring = { version = "4.2", default-features = false, features = ["v1"] }
rand = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json", "query", "rustls"] }
rpassword = "7"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tiny_http = "0.12"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
webbrowser = { version = "1.2.4", features = ["hardened"] }
